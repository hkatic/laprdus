# LaprdusTTS Speech Dispatcher Module Configuration
#
# This file configures the laprdus module for Speech Dispatcher.
# Place this file in /etc/speech-dispatcher/modules/ or
# ~/.config/speech-dispatcher/modules/
#
# To enable this module, add the following to speechd.conf:
#   AddModule "laprdus" "sd_laprdus" "laprdus.conf"
#
# And optionally set it as default output module:
#   DefaultModule laprdus

# Debug level (0=off, 1=errors, 2=warnings, 3=info, 4=debug)
# Debug 0

# Path to LaprdusTTS voice data files (Josip.bin, Vlado.bin). Zvonko, Stojan,
# Mirsad and the singing presets are synthesized by rule and need no data file.
# LaprdusDataDir "/usr/share/laprdus"

# Default voice to use if none specified
# LaprdusDefaultVoice "zvonko"

# Every voice speaks every language: Croatian (hr-HR), Serbian (sr-RS) and
# Bosnian (bs-BA). SET LANGUAGE changes the language and keeps the voice, so
# the symbolic voices below map to the same voice in every language. The
# module's own voice list (LIST VOICES) has every voice for every language;
# a voice is chosen by its id or its name (spd-say -y "Zvonko", -y djedo,
# -y "Dalmacija Klapa").
#
# MALE1 is Zvonko, the default voice (synthesized by rule); MALE2 the
# recorded Josip; MALE3 the old man Đedo; FEMALE1 the old woman Baba;
# CHILD_MALE the child Detence.
AddVoice "hr-HR" "MALE1" "zvonko"
AddVoice "hr-HR" "MALE2" "josip"
AddVoice "hr-HR" "MALE3" "djedo"
AddVoice "hr-HR" "FEMALE1" "baba"
AddVoice "hr-HR" "CHILD_MALE" "detence"

AddVoice "sr-RS" "MALE1" "zvonko"
AddVoice "sr-RS" "MALE2" "josip"
AddVoice "sr-RS" "MALE3" "djedo"
AddVoice "sr-RS" "FEMALE1" "baba"
AddVoice "sr-RS" "CHILD_MALE" "detence"

AddVoice "bs-BA" "MALE1" "zvonko"
AddVoice "bs-BA" "MALE2" "josip"
AddVoice "bs-BA" "MALE3" "djedo"
AddVoice "bs-BA" "FEMALE1" "baba"
AddVoice "bs-BA" "CHILD_MALE" "detence"

# Default voice for every language
DefaultVoice "zvonko"
