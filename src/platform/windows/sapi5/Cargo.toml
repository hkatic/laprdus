[package]
name = "laprdus-sapi5"
description = "SAPI5 driver of the Laprdus text-to-speech engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true

[lib]
# Installed as laprd64.dll and laprd32.dll. The library also exports the C
# API, which the NVDA add-on loads it for.
name = "laprdus_sapi5"
path = "src/lib.rs"
crate-type = ["cdylib"]

[target.'cfg(windows)'.dependencies]
laprdus = { path = "../../../.." }
laprdus-capi = { path = "../../c_api" }
windows = { version = "0.62.2", features = ["Win32_Media_Speech", "Win32_Media_Audio", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_Foundation", "Win32_System_Registry"] }
windows-core = "0.62.2"
windows-registry = "0.6.1"

# COM and the Win32 calls around it cannot be written without unsafe code; it
# stays in this crate.
[lints.rust]
unsafe_code = "allow"

[lints.clippy]
all = { level = "warn", priority = -1 }
