[package]
name = "laprdus-configurator"
description = "Laprdus Configurator: the Windows settings program of the Laprdus text-to-speech engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true

# Installed as laprdgui.exe; the NVDA add-on ships it as laprdgui64.exe and
# laprdgui32.exe.
[[bin]]
name = "laprdgui"
path = "src/main.rs"

[target.'cfg(windows)'.dependencies]
laprdus = { path = "../../../.." }
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Media_Speech",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_UI_Controls",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

# Compiles laprdus_config.rc: the dialog templates, the string tables and the
# manifest.
[target.'cfg(windows)'.build-dependencies]
embed-resource = "3.0.12"

# Win32 cannot be called without unsafe code. All of it is in src/win32.rs,
# the one module that allows it; everywhere else it is an error.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
