[workspace]
members = [".", "src/platform/c_api", "src/platform/cli", "src/platform/linux/speechd", "src/platform/android/native", "src/platform/windows/sapi5", "src/platform/windows/configurator", "tools/xtask"]
resolver = "3"

[workspace.package]
version = "2.0.0"
edition = "2024"
rust-version = "1.85"
license-file = "LICENSE"
repository = "https://github.com/hkatic/laprdus"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[package]
name = "laprdus"
description = "Croatian, Serbian, Bosnian and Slovenian text-to-speech engine"
version.workspace = true
license-file.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
path = "src/common/lib.rs"

[lints]
workspace = true

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[dependencies]
regex = { version = "1.13.1", default-features = false, features = ["std", "perf"] }
serde_json = "1.0.154"
